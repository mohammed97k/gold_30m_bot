name: ICT Gold Bot - Continuous Loop

on:
  workflow_dispatch: # للتشغيل اليدوي لأول مرة

# إلغاء العمليات المتراكمة إذا كانت هناك عملية جديدة
concurrency:
  group: ict-gold-bot-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pytz aiohttp

      - name: Run ICT Gold Bot (Continuous Loop)
        env:
          TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }} # ضروري لكي يقوم البوت باستدعاء نفسه
        run: python -u ict_bot.py
