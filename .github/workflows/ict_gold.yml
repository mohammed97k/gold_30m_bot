name: ICT Gold Bot - Real-Time Loop

on:
  schedule:
    - cron: '0,30 * * * 1-5'  # كل 30 دقيقة، من الاثنين للجمعة
  workflow_dispatch:  # للتشغيل اليدوي

concurrency:
  group: ict-gold-realtime
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy aiohttp pytz
      - env:
          TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: python -u ict_bot.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
          done
